<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IbizaInterX | Links</title>

  <link rel="icon" type="image/png" href="images/favicon-logo-final.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bio-body">

  <main class="bio-page">

    <!-- TOP TEXT -->

    <div class="bio-heading">

      <span>WELCOME TO</span>

      <h1>IbizaInterX</h1>

    </div>


    <!-- LINKS -->

    <div class="bio-links">

<a
  href="https://ibizainterx.com"
  class="bio-button"
>
  Visit IbizaInterX

</a>


      <a
        href="https://www.facebook.com/ibizainterxofficial"
        target="_blank"
        rel="noopener"
        class="bio-button"
      >
        Like Us On Facebook

      </a>


      <a
        href="https://www.tiktok.com/@ibizainterx"
        target="_blank"
        rel="noopener"
        class="bio-button"
      >
        Follow Us On TikTok
        
      </a>


      <a
        href="https://www.linkedin.com/company/ibizainterx"
        target="_blank"
        rel="noopener"
        class="bio-button"
      >
        Connect On LinkedIn
        
      </a>

    </div>


    <!-- BOTTOM CARD -->

<div class="bio-bottom">
  <img
    src="images/bottom-link-in-bio.png"
    alt="IbizaInterX"
  >
</div>

  </main>


  <!-- BETA POPUP -->

  <div class="beta-modal" id="betaModal">

    <div class="beta-modal-card">

      <button
        type="button"
        class="beta-close"
        id="betaClose"
        aria-label="Close"
      >
        ×
      </button>

      <span class="beta-label">
        IBIZAINTERX BETA
      </span>

      <h2>Help shape IbizaInterX.</h2>

      <p>
        Join the private beta and test IbizaInterX before launch.
      </p>

      <form class="beta-form">

        <input
          type="email"
          placeholder="Email address"
          required
        >

        <button type="submit">
          Join the beta →
        </button>

      </form>

      <small>
        No spam. Just beta access and important launch updates.
      </small>

    </div>

  </div>


  <script src="js/main.js"></script>

</body>

</html>
